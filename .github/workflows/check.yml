name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run docs:tools:check
  integration:
    runs-on: ubuntu-latest
    # Matching client/server majors also make custom dump validation reproducible.
    container: postgres:18
    env:
      TEST_DB_ARTIFACT: "off"
    steps:
      - name: Configure masked test administrative connection
        shell: bash
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_DB_ROLE: postgres
          TEST_DB_DATABASE: postgres
        run: |
          admin_url="$(printf '%s://%s@%s:%s/%s' postgresql "$TEST_DB_ROLE" "$TEST_DB_HOST" "$TEST_DB_PORT" "$TEST_DB_DATABASE")"
          printf '::add-mask::%s\n' "$admin_url"
          printf 'TEST_DATABASE_ADMIN_URL=%s\n' "$admin_url" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run integration tests with owned loopback PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cluster_root="$(mktemp -d /tmp/workout-ci-postgres.XXXXXXXX)"
          cleanup() {
            result=$?
            trap - EXIT INT TERM
            if [[ ! "$cluster_root" =~ ^/tmp/workout-ci-postgres\.[A-Za-z0-9]{8}$ ]]; then
              echo 'Refusing an unexpected CI PostgreSQL cleanup path.' >&2
              exit 1
            fi
            if [[ -f "$cluster_root/data/postmaster.pid" ]]; then
              if ! gosu postgres pg_ctl --pgdata "$cluster_root/data" --mode fast --wait --timeout 30 stop; then
                echo 'Owned CI PostgreSQL shutdown failed.' >&2
                exit 1
              fi
            fi
            rm -rf -- "$cluster_root"
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          chown postgres:postgres "$cluster_root"
          install -d -o postgres -g postgres -m 700 "$cluster_root/socket"
          gosu postgres initdb --pgdata "$cluster_root/data" --auth-local trust --auth-host trust --no-locale --encoding UTF8
          gosu postgres pg_ctl --pgdata "$cluster_root/data" --log "$cluster_root/server.log" \
            --options "-h 127.0.0.1 -p 5432 -k $cluster_root/socket" --wait --timeout 30 start
          npm run test:integration
